name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the root site and launcher
        run: |
          npm run build
          cp build/fallback.html build/404.html

          temp_dir="$(mktemp -d)"
          mv build "$temp_dir/root"

          LAUNCHER_BASE_PATH=/autismapps/launcher VITE_PIKTALI_ASSET_URL_MODE=query npm run build:launcher:domains
          LAUNCHER_BASE_PATH=/autismapps/launcher npm run verify:launcher:locales
          LAUNCHER_BASE_PATH=/autismapps/launcher npm run audit:links
          mv build "$temp_dir/launcher"

          mv "$temp_dir/root" build
          mkdir -p build/launcher
          cp -a "$temp_dir/launcher/." build/launcher/

          test -f build/index.html
          test -f build/launcher/index.html
          test -f build/launcher/404.html
          test -f build/launcher/apps/traffic-safety/index.html
          grep -q '/autismapps/launcher/_app/' build/launcher/index.html
          LINK_AUDIT_VARIANTS=build LAUNCHER_BASE_PATH=/autismapps npm run audit:links
        env:
          NODE_OPTIONS: '--unhandled-rejections=warn'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
