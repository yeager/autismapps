<!doctype html>
<html lang="en">
	<head>
		<script>
		// SPA redirect pickup for GitHub Pages 404→launcher redirect
		(function(){
			var redirect = sessionStorage.getItem('spa-redirect');
			if (redirect) {
				sessionStorage.removeItem('spa-redirect');
				history.replaceState(null, '', redirect);
			}
		})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#315a49" />
		<meta name="description" content="Free visual tools for communication, routines, time and emotions. Explore picture support and everyday tools for phones, tablets and computers." />
		<meta name="keywords" content="autism apps, neurodivergent children, ADHD, autism, AAC, communication boards, pictograms, speech support, routines, free apps, PWA" />
		<meta name="author" content="Daniel Nylander" />
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://autismapps.online/launcher/" />
		<meta property="og:title" content="Autismapps — Visual everyday support for autism and neurodivergence" />
		<meta property="og:description" content="Explore free tools for communication, routines, time and emotions. Works on phones, tablets and computers." />

		<meta property="og:url" content="https://autismapps.online/launcher/" />
		<meta property="og:image" content="https://autismapps.online/images/og-image.png" />
